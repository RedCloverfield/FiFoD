networks:
  fifod_network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16
    container_name: fifod_postgres_container
    restart: always
    env_file:
     - .env
    ports:
      - '5432:5432'
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
     - fifod_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    container_name: fifod_redis_container
    restart: always
    env_file:
     - .env
    ports:
      - '6379:6379'
    networks:
     - fifod_network
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--databases', '5']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    restart: no
    env_file:
     - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
     - fifod_network
    command: ['alembic', '-c', 'alembic.ini', 'upgrade', 'head']

  api:
    build: .
    container_name: fifod_api_container
    restart: always
    env_file:
     - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    networks:
     - fifod_network
    healthcheck:
      test: ['CMD', 'curl -s -f http://0.0.0.0:8000/api/v1/healthcheck || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - '8000:8000'

  celery:
    build: .
    container_name: fifod_celery_container
    restart: always
    env_file:
     - .env
    depends_on:
      - redis
      - postgres
    networks:
     - fifod_network
    command: ['celery', '-A', 'worker.celery_app', 'worker', '-l', 'info', '--concurrency=3']